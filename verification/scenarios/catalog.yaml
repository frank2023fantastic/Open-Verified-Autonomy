scenarios:
- id: S01
  gate: G5
  status: DRAFT
  title: Baseline following
  preconditions:
  - One enrolled target in the declared clear area.
  - Complete the applicable frozen gate specification before a qualifying run.
  steps:
  - Enroll the target and record identity.
  - Follow the declared route at the specified pace.
  - Record range, identity, requested motion, wheel state and interventions.
  measurements:
  - distance error distribution
  - identity switches
  - motion limit compliance
  repetitions: null
  supporting_modes:
  - simulation
  - replay
  qualification: G4 may use recorded real scenes; G5/G6 require physical integrated evidence.
  expected_result: Apply the frozen gate criteria; no result has been recorded.
