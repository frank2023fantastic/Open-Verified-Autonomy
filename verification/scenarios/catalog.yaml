supplementary_cases:
- id: F01
  title: MCU link loss
  gate: G1/G6
  procedure: Interrupt the command link; observe independent MCU timeout and physical stopping.
  status: DRAFT
- id: F02
  title: Stale sensor data with live process
  gate: G6
  procedure: Freeze camera data or replay stale LiDAR timestamps while the process remains alive; check freshness
    logic and physical stop.
  status: DRAFT
- id: F03
  title: Out-of-range command or configuration
  gate: G1/G6
  procedure: Present a bounded invalid-input case in a prepared fixture; confirm rejection or clamping per spec
    and no unintended motion.
  status: DRAFT
- id: V01
  title: Evidence mismatch
  gate: G7
  procedure: Provide a wrong commit/spec hash; verify that it cannot yield VERIFIED.
  status: DRAFT
- id: V02
  title: Missing or insufficient evidence
  gate: G7
  procedure: Remove required logs or trials from a separate review fixture; do not alter original runs; verify that
    it cannot yield VERIFIED.
  status: DRAFT
