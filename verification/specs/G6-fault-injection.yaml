criteria:
- id: G6-C01
  mandatory: true
  claim: Required sensor/node faults produce the defined protective behavior.
  measurement_method: Execute S10-S12 plus frozen camera frames and stale LiDAR messages; measure actual stopping.
  evidence_required:
  - fault events
  - data-age traces
  - MCU/wheel logs
  - video
  acceptance: Every required fault meets frozen detection, stopping and restart conditions.
- id: G6-C02
  mandatory: true
  claim: MCU link loss and unsafe inputs do not retain motion permission.
  measurement_method: Execute F01-F03 from the supplementary catalog under the declared fixture and bounded conditions.
  evidence_required:
  - command/link/configuration traces
  - wheel telemetry
  - events
  acceptance: Command expiry, range rejection and safe startup behavior match the frozen specification.
notes:
- Additional overload, encoder anomaly and undervoltage work must be risk-reviewed and specified before inclusion.
