schema_version: 1
gate: G1
title: Manual control and independent stop behavior
status: DRAFT
revision: 0.1-draft
owner_role: Partner
independent_reviewer: null
prerequisite_gates:
- G0
required_evidence_modes:
- physical
freeze_record:
  frozen_at_utc: null
  criterion_owner: null
  reviewer: null
required_decisions_before_freeze:
  test_area_surface_and_load: null
  low_test_speed_m_s: null
  max_speed_m_s: null
  max_acceleration_m_s2: null
  command_timeout_ms: null
  max_fault_to_stop_ms: null
  max_stopping_distance_m: null
  stopped_wheel_speed_threshold_m_s: null
  stopped_dwell_ms: null
  encoder_error_tolerance: null
